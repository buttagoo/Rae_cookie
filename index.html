reset();
function update(dt){
 if(S.tw.length){S.qt-=dt;if(S.qt<=0&&S.en.length<5){S.en.push({hp:3,x:WP[0][0],y:WP[0][1],i:0,fi:Math.floor(Math.random()*FACES.length),eat:0,ek:0,fat:0,fv:0,sp:50+Math.random()*14});S.qt=3.2}}
 for(const e of S.en){
  e.eat=Math.max(0,e.eat-dt);e.fv+=(e.fat-e.fv)*Math.min(1,dt*6);
  let step=e.sp*dt;
  while(step>0&&!e.gone){
   const [tx,ty]=WP[e.i+1],dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
   if(d<=step){e.x=tx;e.y=ty;e.i++;step-=d;if(e.i>=WP.length-1)e.gone=1}
   else{e.x+=dx/d*step;e.y+=dy/d*step;step=0}
  }
 }
 for(const t of S.tw){
  t.cd-=dt;t.thr=Math.max(0,t.thr-dt);t.hop=Math.max(0,t.hop-dt);
  if(t.cd>0)continue;
  const tg=S.en.find(e=>!e.gone&&e.hp>0&&Math.hypot(e.x-t.x,e.y-t.y)<=320);
  if(tg){S.sh.push({x:t.x,y:t.y,t:tg,k:0,age:0});t.cd=1.1;t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);t.thr=.18}
 }
 for(const s of S.sh){
  const e=s.t;if(e.hp<=0||e.gone){s.dead=1;continue}
  s.age+=dt;const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy),st=520*dt;
  if(d<=st+8){s.dead=1;e.hp--;e.eat=.6;e.fat=Math.min(5,e.fat+1)}else{s.x+=dx/d*st;s.y+=dy/d*st}
 }
 for(const e of S.en)if(e.hp<=0&&!e.gone){e.gone=1;S.gh.push({x:e.x,y:e.y,R:ER,t:.9,fat:e.fv,fi:e.fi})}
 S.en=S.en.filter(e=>!e.gone);S.sh=S.sh.filter(s=>!s.dead);
}
