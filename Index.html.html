 }

  if(tg){S.sh.push({x:t.x,y:t.y,t:tg,k:0,age:0});t.cd=1.1;t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);t.thr=.18}
 }
 for(const s of S.sh){
  const e=s.t;if(e.hp<=0||e.gone){s.dead=1;continue}

  if(d<=st+8){s.dead=1;e.hp--;e.eat=.6;e.fat=Math.min(5,e.fat+1)}else{s.x+=dx/d*st;s.y+=dy/d*st}
 }
 for(const e of S.en)if(e.hp<=0&&!e.gone){e.gone=1;S.gh.push({x:e.x,y:e.y,R:ER,t:.9,fat:e.fv,fi:e.fi})}

C.addEventListener('pointerdown',ev=>{

},{passive:false});
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}

function blob(x,y,r,k,n){X.beginPath();for(let i=0;i<=n;i++){const a=i/n*6.2832,w=1+.045*Math.sin(a*3+k)+.03*Math.sin(a*7+k*2),px=x+Math.cos(a)*r*w,py=y+Math.sin(a)*r*w;i?X.lineTo(px,py):X.moveTo(px,py)}X.closePath()}
const CH=[[-.45,-.3,.2],[.3,-.45,.17],[.5,.1,.2],[-.1,.1,.18],[-.5,.35,.16],[.15,.55,.18],[-.1,-.62,.13],[.62,-.2,.12]];
function cookie(x,y,k,r){

 let g=X.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r*1.05);

 blob(x,y,r,k,30);X.fillStyle=g;X.fill();
 X.lineWidth=Math.max(1,r*.07);X.strokeStyle='rgba(70,35,12,.6)';X.stroke();
 X.fillStyle='rgba(95,55,22,.28)';
 for(let i=0;i<12;i++){const a=i*2.4,d=r*(.2+((i*37)%10)/15);X.beginPath();X.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*.035,0,7);X.fill()}
 if(k==1){
  g=X.createRadialGradient(x-r*.25,y-r*.3,r*.05,x,y,r*.85);
  g.addColorStop(0,'#ffd0e0');g.addColorStop(1,'#e88aab');
  blob(x,y,r*.82,k+3,26);X.fillStyle=g;X.fill();X.lineWidth=Math.max(1,r*.04);X.strokeStyle='rgba(150,50,95,.5)';X.stroke();
  X.fillStyle='rgba(255,255,255,.4)';X.beginPath();X.ellipse(x-r*.28,y-r*.35,r*.28,r*.13,-.6,0,7);X.fill();
  const sp=['#fff','#ffe066','#7ad0ff','#a6e36b','#fff','#ffe066'];
  X.lineCap='round';X.lineWidth=Math.max(1.5,r*.07);
  for(let i=0;i<10;i++){const a=i*2.1,d=r*(.12+((i*53)%10)/16),q=i*1.7,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;X.strokeStyle=sp[i%6];X.beginPath();X.moveTo(px,py);X.lineTo(px+Math.cos(q)*r*.1,py+Math.sin(q)*r*.1);X.stroke()}
 }else{
  CH.forEach((h,i)=>{
   if(k==2&&i>5)return;

   blob(cx,cy,cr,i,7);X.fillStyle=w?'#f3e2bd':'#2f170b';X.fill();
   X.fillStyle=w?'rgba(255,255,255,.6)':'rgba(190,120,70,.55)';X.beginPath();X.arc(cx-cr*.3,cy-cr*.3,cr*.28,0,7);X.fill();
  });
 }
}
const SH={a:'#5b8fd6',f:'#e0583a',t:'#62a84a'};
function drawBody(x,y,R,fat,eat,col,al,ph){
 const f=Math.min(fat,5),jg=eat>0?1+.08*Math.sin((1-Math.min(1,eat/.6))*18):1,
  rx=R*(.5+.12*f)*jg,ry=R*(.6+.05*f),cy=y+R*1.2,sw=Math.sin(ph)*R*.14;
 X.save();X.globalAlpha=al;X.lineCap='round';
 for(const sd of[-1,1]){

  X.fillStyle='#3b3b4f';X.beginPath();X.roundRect(lx-R*.12,top,R*.24,R*.34-lift,R*.07);X.fill();

 }
 X.strokeStyle='#e3b594';X.lineWidth=R*.17;
 for(const sd of[-1,1]){X.beginPath();X.moveTo(x+sd*rx*.85,cy-ry*.45);X.lineTo(x+sd*(rx+R*.16),cy+ry*.15+sw*sd);X.stroke()}
 X.fillStyle=col;X.beginPath();X.ellipse(x,cy,rx,ry,0,0,7);X.fill();
 X.lineWidth=3.5;X.strokeStyle='rgba(20,10,5,.7)';X.stroke();
 X.fillStyle='rgba(255,255,255,.24)';X.beginPath();X.ellipse(x-rx*.28,cy-ry*.2,rx*.3,ry*.3,0,0,7);X.fill();

function drawFace(x,y,R,eat,ek,ring,al,fi){
 const p=Math.min(1,eat/.6),ph=(1-p)*18,sq=eat>0?1+.06*Math.sin(ph):1;

 dr();
 if(eat>0){

   X.save();X.beginPath();X.rect(-R,my+op,R*2,R*2);X.clip();X.translate(0,op);dr();X.restore();
   X.fillStyle='#2a0f0f';X.beginPath();X.ellipse(0,my+op/2,R*.3,op/2+.5,0,0,7);X.fill();
   X.fillStyle='#e0707a';X.beginPath();X.ellipse(0,my+op*.8,R*.15,op*.2+.5,0,0,7);X.fill();
  }
 }
 X.restore();
 X.lineWidth=4;X.strokeStyle=ring;X.beginPath();X.arc(0,0,R+2,0,7);X.stroke();
 if(eat>0){
  cookie(0,R*(MY[fi||0]-.04),ek,R*(.12+.85*p));
  X.fillStyle=ek==1?'#f4a6c0':'#c98b4a';
  for(let i=0;i<5;i++){const a=i*1.26+.5,dd=R*(.6+(1-p)*.9);X.beginPath();X.arc(Math.cos(a)*dd,R*(MY[fi||0]-.04)+Math.sin(a)*dd*.6,R*.07,0,7);X.fill()}
 }

}
function girl(t){

 X.fillStyle='rgba(255,255,255,.6)';for(let i=-24;i<24;i+=8)X.fillRect(i,-4,3.5,40);for(let j=-4;j<36;j+=8)X.fillRect(-24,j,48,3.5);

 for(const sx of[-9,0,9]){X.beginPath();X.arc(sx,sx?-36:-39,5.5,0,7);X.fill()}

 X.fillStyle='#4f7fa5';for(const sx of[-5.5,5.5]){X.beginPath();X.arc(sx,-14,2.4,0,7);X.fill()}
 X.fillStyle='rgba(240,110,110,.45)';for(const sx of[-8.5,8.5]){X.beginPath();X.ellipse(sx,-8.5,3.6,2.5,0,0,7);X.fill()}

function draw(){
 for(let c=0;c<12;c++)for(let r=0;r<8;r++){
